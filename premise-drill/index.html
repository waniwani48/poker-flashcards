<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121212">
<meta name="description" content="BB が BTN の CB に直面した場面を、前提票5欄を順に埋めてから判定する訓練フォーム。">
<title>前提票ドリル</title>

<!-- PWA：ホーム画面に追加→スタンドアロン起動・オフライン動作（sw.js はアプリ本体のみキャッシュ） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="前提票">

<!-- Google Fonts は1本だけ。取得失敗時は css/tokens.css の font-family フォールバックが効く -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">

<!-- CSS 読込順（SPEC ⑫）：tokens → app → ui-* -->
<link rel="stylesheet" href="css/tokens.css?v=15">
<link rel="stylesheet" href="css/app.css?v=15">
<link rel="stylesheet" href="css/ui-home.css?v=15">
<link rel="stylesheet" href="css/ui-guide.css?v=15">
<link rel="stylesheet" href="css/ui-drill.css?v=15">
<link rel="stylesheet" href="css/ui-truth.css?v=15">
<link rel="stylesheet" href="css/ui-map.css?v=15">
<link rel="stylesheet" href="css/ui-settings.css?v=15">
<link rel="stylesheet" href="css/ui-memo.css?v=15">
</head>
<body data-view="home">
<div class="pd-app">
  <header class="pd-header">
    <h1 class="pd-title">前提票ドリル</h1>
    <nav class="pd-nav" aria-label="画面">
      <button type="button" class="pd-btn pd-btn-ghost" data-go="home">ホーム</button>
      <button type="button" class="pd-btn pd-btn-ghost" data-go="map">弱点マップ</button>
      <button type="button" class="pd-btn pd-btn-ghost" data-go="settings">設定</button>
    </nav>
  </header>
  <main id="pd-root"></main>
</div>
<noscript><p class="pd-card">このアプリは JavaScript が必要です。</p></noscript>

<!-- JS 読込順（SPEC ⑫・SPEC-memo ⑦）：util → cards → range-data → range → generator → sheet → wizard → gaps → localjudge → store → judge → memo → ui/* → app -->
<script src="js/util.js?v=15"></script>
<script src="js/cards.js?v=15"></script>
<script src="js/range-data.js?v=15"></script>
<script src="js/range.js?v=15"></script>
<script src="js/generator.js?v=15"></script>
<script src="js/sheet.js?v=15"></script>
<script src="js/wizard.js?v=15"></script>
<script src="js/gaps.js?v=15"></script>
<script src="js/localjudge.js?v=15"></script>
<script src="js/store.js?v=15"></script>
<script src="js/judge.js?v=15"></script>
<script src="js/memo.js?v=15"></script>
<script src="js/ui/memo.js?v=15"></script>
<script src="js/ui/guide.js?v=15"></script>
<script src="js/ui/home.js?v=15"></script>
<script src="js/ui/drill.js?v=15"></script>
<script src="js/ui/truth.js?v=15"></script>
<script src="js/ui/map.js?v=15"></script>
<script src="js/ui/settings.js?v=15"></script>
<script src="js/app.js?v=15"></script>
<script>
// service worker 登録（https / localhost のみ。file:// では何もしない）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { /* 登録失敗はアプリ動作に影響しない */ });
  });
}
</script>
</body>
</html>
